# Служебные каталоги и файлы не должны отдаваться по HTTP.
# Приложение подключает их через require (файловая система), веб-доступ ему не нужен.
<DirectoryMatch "^/var/www/html/(vendor|db|tests|bin|models|docker)(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "^(\.env.*|\.dockerignore|\.gitignore|composer\.(json|lock)|Dockerfile|docker-compose.*|README.*|.*\.sql|config\.php|functions\.php|auth\.php)$">
    Require all denied
</FilesMatch>
