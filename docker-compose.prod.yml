# БОЕВОЙ запуск: приложение + PostgreSQL + Caddy (HTTPS).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   (или один раз задайте COMPOSE_FILE=docker-compose.prod.yml в файле .env на сервере - тогда обычный `docker compose ...`)
#
# Подробная инструкция: docs/DEPLOYMENT.md. Для локальной разработки используйте docker-compose.yml.
#
# Наружу открыты ТОЛЬКО порты 80 и 443 (Caddy). База данных и приложение доступны лишь внутри сети compose.
name: vacation

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-vacation}
      POSTGRES_USER: ${DB_USERNAME:-vacation}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в файле .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Схема создаётся ОДИН РАЗ при первом запуске (пустой том). Демо-данных на боевом сервере нет.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-vacation}
      DB_USERNAME: ${DB_USERNAME:-vacation}
      DB_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в файле .env}
      DB_CHARSET: utf8
      DB_SCHEMA: public
      # Строгий режим: вход админа только по HTTPS, сложный пароль, демо-вход закрыт. Менять нельзя.
      APP_ENV: production
      # Перед приложением стоит Caddy: доверяем его X-Forwarded-Proto / X-Forwarded-For.
      # Это безопасно ТОЛЬКО потому, что порт приложения наружу не опубликован.
      APP_TRUST_PROXY: "1"
      ADMIN_IDLE_MINUTES: ${ADMIN_IDLE_MINUTES:-30}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-8}
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 80) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]
    # ports: НЕТ - приложение доступно только через Caddy

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?Задайте DOMAIN в файле .env}
      ACME_EMAIL: ${ACME_EMAIL:?Задайте ACME_EMAIL в файле .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # сертификаты (не удаляйте: у Let's Encrypt есть лимиты на выпуск)
      - caddy_config:/config
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
